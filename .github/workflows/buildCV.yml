name: Build and Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

        # ---- Dependencies -----
      - name: Setup TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX Packages
        run: |
          tlmgr update --self
          tlmgr install preprint titlesec enumitem fancyhdr fontawesome5 tools lastpage cormorantgaramond charter xcolor hyperref bookmark fontaxes
          tlmgr list --only-installed
        shell: powershell

        # ---- Build Resumes ----
      - name: Generate Resumes
        run: |
          ./build.ps1 -Debug
        shell: powershell

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: build/*.pdf
          if-no-files-found: error

        # ---- Release (uses tag that triggered the workflow) ----
      - name: Create GitHub Release and Upload PDFs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Resume Release ${{ github.ref_name }}
          body: |
            Automated resume build from tag **${{ github.ref_name }}**
            
            Commit: ${{ github.sha }}

            ## Generated Artifacts
            - Resume PDFs (LaTeX)
          files: |
            build/*.pdf
          make_latest: true

      - name: Trigger portfolio deploy
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PORTFOLIO_DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          PORTFOLIO_REPO: George-Fam/developerFolio
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PORTFOLIO_DISPATCH_TOKEN)) {
            Write-Host "PORTFOLIO_DISPATCH_TOKEN is not set; skipping portfolio deploy trigger."
            exit 0
          }

          $headers = @{
            Authorization = "Bearer $env:PORTFOLIO_DISPATCH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            event_type = "resume_release"
            client_payload = @{
              release_tag = $env:RELEASE_TAG
              source_sha = $env:SOURCE_SHA
            }
          } | ConvertTo-Json -Depth 4

          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/$env:PORTFOLIO_REPO/dispatches" `
            -Headers $headers `
            -Body $body `
            -ContentType "application/json"
        shell: pwsh
